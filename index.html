<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NDX.A - Intelligence Collaborative</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&family=Dancing+Script:wght@700&display=swap');

        :root {
            --primary: #00a8ff;
            --accent: #9c88ff;
            --bg: #ffffff;
            --text: #2f3640;
            --ai-bubble: #f1f2f6;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Comfortaa', sans-serif;
            margin: 0; padding: 0;
            display: flex; flex-direction: column; height: 100vh;
        }

        .header {
            padding: 15px;
            display: flex; align-items: center; justify-content: center;
            border-bottom: 1px solid #f1f2f6;
            position: relative;
            background: white; z-index: 10;
        }

        .logo-ndx {
            width: 45px; height: 45px;
            border-radius: 50%; margin-right: 12px;
            border: 2px solid var(--primary);
            object-fit: cover;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            margin: 0; font-size: 1.8rem; color: var(--primary);
        }

        #chat-box {
            flex: 1; padding: 20px;
            overflow-y: auto; background-color: #ffffff;
            scroll-behavior: smooth;
        }

        .msg {
            margin-bottom: 20px; padding: 14px 18px;
            border-radius: 20px; max-width: 85%;
            font-size: 0.95rem; line-height: 1.5;
            position: relative;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .user-msg {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white; margin-left: auto;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 10px rgba(0, 168, 255, 0.2);
        }

        .ai-msg {
            background-color: var(--ai-bubble);
            color: var(--text); margin-right: auto;
            border-bottom-left-radius: 4px;
        }

        .typing { font-size: 0.8rem; color: #a0a0a0; margin: 10px 25px; display: none; font-style: italic; }

        .input-area {
            padding: 20px; background: white;
            display: flex; gap: 12px; border-top: 1px solid #f1f2f6;
        }

        input[type="text"] {
            flex: 1; padding: 14px 22px;
            border: 2px solid #f1f2f6; border-radius: 30px;
            outline: none; font-family: 'Comfortaa', sans-serif;
            transition: all 0.3s; font-size: 1rem;
        }

        .btn-send {
            background: var(--primary); color: white; border: none;
            width: 50px; height: 50px; border-radius: 50%;
            cursor: pointer; font-size: 1.2rem;
        }

        .modal {
            display: none; position: fixed;
            top:0; left:0; width:100%; height:100%;
            background: white; z-index: 3000;
            flex-direction: column; justify-content: center; align-items: center;
        }

        #admin-trigger { position: absolute; top: 0; right: 0; width: 40px; height: 40px; opacity: 0; cursor: pointer; }
        
        .admin-panel {
            display: none; position: fixed;
            top: 10%; left: 5%; width: 90%; height: 80%;
            background: white; border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            z-index: 4000; padding: 25px; overflow-y: auto;
        }
    </style>
</head>
<body>

<div id="authModal" class="modal">
    <h1>NDX.A</h1>
    <p style="color: #7f8c8d;">L'intelligence collaborative de la 1ère.</p>
    <input type="text" id="reg-pseudo" placeholder="Ton Pseudo..." style="padding:15px; margin:25px; border-radius:15px; border:2px solid #eee; width:200px; text-align:center;">
    <button onclick="saveUser()" style="background:var(--primary); color:white; padding:12px 30px; border:none; border-radius:25px; cursor:pointer;">Lancer NDX.A</button>
</div>

<div id="adminPanel" class="admin-panel">
    <h3>Dashboard Adama 👑</h3>
    <div id="registry-list"></div>
    <button onclick="closeAdmin()" style="margin-top:20px;">Fermer</button>
</div>

<div class="header">
    <div id="admin-trigger" onclick="openAdmin()"></div>
    <img src="logo-ndxa-1ereA.png" class="logo-ndx" alt="Logo" onerror="this.src='https://via.placeholder.com/50'">
    <h1>NDX.A</h1>
</div>

<div id="chat-box">
    <div class="msg ai-msg">Systèmes activés. Je suis NDX.A, ton intelligence augmentée. Je suis prête à explorer n'importe quel sujet avec toi. Que souhaites-tu analyser aujourd'hui ?</div>
</div>
<div id="typing-status" class="typing">NDX.A est en train de réfléchir...</div>

<div class="input-area">
    <input type="text" id="user-input" placeholder="Pose-moi une question complexe...">
    <button class="btn-send" onclick="sendMessage()">➔</button>
</div>

<script>
    let userPseudo = "";
    let contextHistory = []; // Mémoire de la conversation
    const forbidden = ["casino", "pari", "bet", "argent", "triche", "hack"];

    window.onload = function() {
        let saved = localStorage.getItem('ndxa_pseudo');
        if(!saved) { document.getElementById('authModal').style.display = 'flex'; }
        else { userPseudo = saved; }
    };

    function saveUser() {
        let p = document.getElementById('reg-pseudo').value.trim();
        if(p.length < 2) return;
        userPseudo = p;
        localStorage.setItem('ndxa_pseudo', p);
        let reg = JSON.parse(localStorage.getItem('ndxa_reg') || "[]");
        if(!reg.includes(p)) reg.push(p);
        localStorage.setItem('ndxa_reg', JSON.stringify(reg));
        document.getElementById('authModal').style.display = 'none';
        addMessage(`Connexion établie. Ravi de collaborer avec toi, ${userPseudo}.`, 'ai-msg');
    }

    function sendMessage() {
        let input = document.getElementById('user-input').value.trim();
        if(!input) return;

        addMessage(input, 'user-msg');
        contextHistory.push(input.toLowerCase());
        document.getElementById('user-input').value = "";
        document.getElementById('typing-status').style.display = "block";

        // Simulation d'une réflexion "boostée"
        setTimeout(() => {
            document.getElementById('typing-status').style.display = "none";
            let response = getDeepResponse(input.toLowerCase());
            addMessage(response, 'ai-msg');
        }, 1500);
    }

    function addMessage(text, type) {
        let box = document.getElementById('chat-box');
        let div = document.createElement('div');
        div.className = "msg " + type;
        div.innerText = text;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    function getDeepResponse(q) {
        // 1. Sécurité stricte
        for(let word of forbidden) { if(q.includes(word)) return "Désolé, ma politique de sécurité m'empêche d'explorer ce domaine. Concentrons-nous sur des sujets plus productifs."; }

        // 2. Logique de réflexion boostée
        if(q.includes("aide") || q.includes("faire quoi")) return "Je peux t'aider à structurer une pensée, rédiger un texte, résoudre un problème logique ou simplement débattre d'une idée. Quel domaine t'intéresse ?";
        
        if(q.includes("philosophie") || q.includes("pense")) return "La pensée humaine est fascinante. Si on analyse cela sous l'angle de la logique pure, chaque question amène une infinité de variables. Qu'en penses-tu, toi ?";

        if(q.includes("ton créateur") || q.includes("qui t'a fait")) return "J'ai été mise au point par Ndiaye Adama. Il m'a conçue pour être l'intelligence la plus fluide pour votre classe.";

        // 3. IA Sociale & Adaptative (comme Gemini)
        if(q.includes("merci")) return "C'est un plaisir de t'aider ! N'hésite pas si tu as d'autres points à éclaircir.";
        if(q.includes("salut") || q.includes("bonjour")) return `Salut ${userPseudo} ! Mon processeur est prêt. On lance une session de travail ou on discute de tout et de rien ?`;

        // 4. Réponses de réflexion profonde (Aléatoires)
        const deepFillers = [
            "C'est une question qui mérite une analyse multicouche. Si on regarde le contexte global, on s'aperçoit que...",
            "D'après mes données, cette situation peut être interprétée de deux façons. La première est pragmatique, la seconde est plus créative. Laquelle préfères-tu ?",
            "Ta question est excellente. Elle me rappelle certains concepts de logique avancée. Pour te répondre précisément, j'aurais besoin de savoir : quel est ton objectif final avec cette info ?",
            "Je traite ta demande... Il semblerait que ce soit un sujet complexe. Mon conseil serait de commencer par simplifier les bases avant de s'attaquer au reste."
        ];

        return deepFillers[Math.floor(Math.random() * deepFillers.length)];
    }

    // ADMIN
    function openAdmin() {
        if(prompt("Accès Admin :") === "ADAMA99") {
            document.getElementById('adminPanel').style.display = 'block';
            let reg = JSON.parse(localStorage.getItem('ndxa_reg') || "[]");
            document.getElementById('registry-list').innerHTML = reg.join(" • ");
        }
    }
    function closeAdmin() { document.getElementById('adminPanel').style.display = 'none'; }
</script>

</body>
</html>
