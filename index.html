<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NDX.A - Expertise Universelle</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@1,700&display=swap');

        :root {
            --primary: #0084ff;
            --accent: #6c5ce7;
            --bg: #0b0e14;
            --card: #161b22;
            --text: #e6edf3;
            --glass: rgba(15, 23, 42, 0.9);
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at top right, rgba(0, 132, 255, 0.1), transparent),
                              radial-gradient(circle at bottom left, rgba(108, 92, 231, 0.1), transparent);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0; padding: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* SIGNATURE FIXE */
        .admin-signature {
            position: fixed; top: 8px; left: 50%;
            transform: translateX(-50%);
            font-family: 'Playfair Display', serif;
            font-style: italic; font-size: 0.65rem;
            color: var(--primary); letter-spacing: 3px;
            z-index: 2000; text-transform: uppercase;
            white-space: nowrap;
        }

        /* HEADER FIXE */
        .header {
            height: 60px;
            padding: 0 20px;
            display: flex; align-items: center; justify-content: space-between;
            background: var(--glass);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            position: sticky; top: 0; width: 100%; z-index: 1000;
        }

        h1 { font-size: 1.2rem; font-weight: 600; letter-spacing: 2px; color: #fff; margin: 0; margin-top: 5px;}

        /* ZONE DE CHAT ÉLARGIE */
        #chat-box {
            flex: 1; 
            padding: 20px;
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 15px;
            width: 100%;
            max-width: 800px;
            margin: 0 auto; /* Centrage horizontal */
            scrollbar-width: none;
        }
        #chat-box::-webkit-scrollbar { display: none; }

        .msg {
            padding: 14px 18px;
            border-radius: 18px; 
            max-width: 85%;
            font-size: 0.95rem; 
            line-height: 1.5;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .user-msg { background: var(--primary); color: white; margin-left: auto; border-bottom-right-radius: 4px; }
        .ai-msg { background: var(--card); border: 1px solid rgba(255,255,255,0.08); margin-right: auto; border-bottom-left-radius: 4px; }

        /* BARRE DE SAISIE FIXE EN BAS */
        .input-area {
            padding: 15px;
            background: var(--bg);
            display: flex; gap: 10px;
            border-top: 1px solid rgba(255,255,255,0.05);
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        input[type="text"] {
            flex: 1; padding: 12px 18px; border: 1px solid rgba(255,255,255,0.1);
            border-radius: 25px; outline: none; background: #1c2128; color: white;
            font-size: 1rem;
        }

        .btn-send { 
            background: var(--primary); color: white; border: none; 
            width: 45px; height: 45px; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        /* SIDEBAR */
        .sidebar {
            width: 280px; height: 100%; background: var(--card);
            position: fixed; left: -280px; top: 0; transition: 0.3s; z-index: 3000;
            padding: 20px; border-right: 1px solid rgba(255,255,255,0.1);
        }
        .sidebar.active { left: 0; }
        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 2500; }
    </style>
</head>
<body>

<div class="admin-signature">BY NDIAYE ADAMA</div>
<div id="overlay" class="overlay" onclick="toggleMenu()"></div>

<div id="sidebar" class="sidebar">
    <h3 style="color:var(--primary)">NDX.A LOGS</h3>
    <div id="history-list"></div>
    <button onclick="location.reload()" style="width:100%; padding:10px; margin-top:20px; background:transparent; border:1px solid red; color:red; border-radius:10px;">RESET</button>
</div>

<div class="header">
    <div onclick="toggleMenu()" style="cursor:pointer; font-size:1.5rem;">☰</div>
    <h1>NDX.A</h1>
    <div style="width:10px; height:10px; background:#00ff00; border-radius:50%; box-shadow: 0 0 10px #00ff00;"></div>
</div>

<div id="chat-box"></div>

<div class="input-area">
    <input type="text" id="user-input" placeholder="Message..." autocomplete="off">
    <button class="btn-send" onclick="sendMessage()">➔</button>
</div>

<script>
    function toggleMenu() {
        document.getElementById('sidebar').classList.toggle('active');
        document.getElementById('overlay').style.display = 
            document.getElementById('sidebar').classList.contains('active') ? 'block' : 'none';
    }

    function sendMessage() {
        let input = document.getElementById('user-input');
        let val = input.value.trim();
        if(!val) return;
        
        addMessage(val, 'user-msg');
        input.value = "";
        
        setTimeout(() => {
            let resp = "ANALYSE NDX.A : En tant qu'expert universel, j'ai traité votre requête. Précisez votre demande pour une exécution à 100%.";
            if(val.toLowerCase().includes("qui es-tu")) resp = "Je suis l'entité **NDX.A**, l'éminence grise forgée par **Ndiaye Adama**.";
            addMessage(resp, 'ai-msg');
        }, 600);
    }

    function addMessage(text, type) {
        let box = document.getElementById('chat-box');
        let div = document.createElement('div');
        div.className = "msg " + type;
        div.innerHTML = text;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    document.getElementById('user-input').addEventListener("keypress", (e) => { if(e.key === "Enter") sendMessage(); });

    window.onload = () => { addMessage("Système NDX.A prêt. Expertise activée. **Ndiaye Adama**, j'attends vos ordres.", 'ai-msg'); };
</script>
</body>
</html>
