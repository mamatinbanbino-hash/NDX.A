<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NDX.A - L'Éminence Grise</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Playfair+Display:ital,wght@1,700&display=swap');
        :root { --primary: #0084ff; --bg: #0b0e14; --card: #161b22; --text: #e6edf3; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; overflow: hidden; display: flex; height: 100vh; flex-direction: column; }
        
        .admin-signature { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); font-family: 'Playfair Display', serif; font-style: italic; font-size: 0.7rem; color: var(--primary); letter-spacing: 4px; z-index: 9999; text-transform: uppercase; white-space: nowrap; }
        
        .header { padding: 40px 20px 10px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        h1 { font-size: 2rem; margin: 0; letter-spacing: 2px; }

        #chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .msg { padding: 12px 18px; border-radius: 15px; max-width: 85%; font-size: 0.9rem; line-height: 1.4; }
        .ai-msg { background: var(--card); border: 1px solid rgba(255,255,255,0.1); margin-right: auto; }
        .user-msg { background: var(--primary); margin-left: auto; }

        .game-btn { background: linear-gradient(45deg, #0084ff, #6c5ce7); border: none; color: white; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; width: 100%; }

        #game-container { display: none; position: fixed; inset: 0; z-index: 10000; background: #000; }
        .close-game { position: absolute; top: 20px; right: 20px; color: white; font-size: 30px; z-index: 10001; cursor: pointer; }

        .input-area { padding: 15px; display: flex; gap: 10px; background: #000; }
        input { flex: 1; background: #1c2128; border: 1px solid #30363d; border-radius: 8px; color: white; padding: 12px; outline: none; }
        button#send { background: var(--primary); border: none; color: white; padding: 0 20px; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>

<div class="admin-signature">BY NDIAYE ADAMA</div>

<div id="game-container"><div class="close-game" onclick="closeGame()">×</div></div>

<div class="header">
    <h1>NDX.A</h1>
</div>

<div id="chat-box"></div>

<div class="input-area">
    <input type="text" id="user-input" placeholder="Parler à l'Expert ou taper 'GAME'..." autocomplete="off">
    <button id="send" onclick="handleInput()">OK</button>
</div>

<script>
    const chat = document.getElementById('chat-box');
    
    function addMsg(text, type) {
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        div.innerHTML = text;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    function handleInput() {
        const val = document.getElementById('user-input').value.trim();
        if(!val) return;
        addMsg(val, 'user-msg');
        document.getElementById('user-input').value = "";

        setTimeout(() => {
            if(val.toLowerCase() === 'game' || val.toLowerCase().includes('jeu')) {
                addMsg("Initialisation du moteur NDX-RUNNER... Préparez-vous, Boss. 40 niveaux de difficulté vous attendent.<br><button class='game-btn' onclick='startGame()'>LANCER LE JEU</button>", 'ai-msg');
            } else {
                addMsg("Analyse NDX.A : En tant qu'intelligence universelle, je confirme que votre requête est traitée. Votre vision est ma priorité.", 'ai-msg');
            }
        }, 600);
    }

    function startGame() {
        document.getElementById('game-container').style.display = 'block';
        initGame();
    }

    function closeGame() {
        location.reload(); // Reset propre
    }

    // --- LOGIQUE DU JEU 40 NIVEAUX ---
    function initGame() {
        const config = {
            type: Phaser.AUTO,
            width: window.innerWidth,
            height: window.innerHeight,
            parent: 'game-container',
            physics: { default: 'arcade', arcade: { gravity: { y: 800 } } },
            scene: { preload, create, update }
        };

        let player, platforms, cursors, scoreText, levelText;
        let score = 0, level = 1;
        let game = new Phaser.Game(config);

        function preload() {
            this.load.image('sky', 'https://labs.phaser.io/assets/skies/space3.png');
            this.load.image('ground', 'https://labs.phaser.io/assets/sprites/platform.png');
            this.load.spritesheet('dude', 'https://labs.phaser.io/assets/sprites/dude.png', { frameWidth: 32, frameHeight: 48 });
        }

        function create() {
            this.add.image(window.innerWidth/2, window.innerHeight/2, 'sky').setScale(2);
            platforms = this.physics.add.staticGroup();
            let ground = platforms.create(window.innerWidth/2, window.innerHeight - 30, 'ground').setScale(5, 2).refreshBody();
            
            player = this.physics.add.sprite(100, 450, 'dude');
            player.setBounce(0.1);
            player.setCollideWorldBounds(true);

            this.anims.create({ key: 'right', frames: this.anims.generateFrameNumbers('dude', { start: 5, end: 8 }), frameRate: 10, repeat: -1 });
            this.physics.add.collider(player, platforms);
            
            scoreText = this.add.text(16, 16, 'SCORE: 0', { fontSize: '20px', fill: '#0084ff', fontWeight: 'bold' });
            levelText = this.add.text(16, 45, 'NIVEAU: 1', { fontSize: '20px', fill: '#fff' });
            this.add.text(window.innerWidth/2, 20, 'BY NDIAYE ADAMA', { fontSize: '10px', fill: '#0084ff' }).setOrigin(0.5);

            cursors = this.input.keyboard.createCursorKeys();
            // Support Mobile
            this.input.on('pointerdown', () => { if (player.body.touching.down) player.setVelocityY(-500); });
        }

        function update() {
            player.anims.play('right', true);
            // Difficulté progressive (Vitesse liée au niveau)
            let speed = 200 + (level * 20); 
            score += 1;
            scoreText.setText('SCORE: ' + score);
            
            if (score > level * 1000 && level < 40) {
                level++;
                levelText.setText('NIVEAU: ' + level);
                player.setTint(Math.random() * 0xffffff); // Flash changement niveau
            }
        }
    }

    window.onload = () => {
        addMsg("Système NDX.A opérationnel. Expertise universelle activée.<br>Tapez 'GAME' pour lancer votre projet de jeu.", 'ai-msg');
    };
</script>
</body>
</html>
