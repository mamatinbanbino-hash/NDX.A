<script>
    // Chargement sécurisé de la config
    const apiKey = (typeof NDX_CONFIG !== 'undefined') ? NDX_CONFIG.apiKey : "";

    function addMsg(text, type) {
        const box = document.getElementById('chat-box');
        const div = document.createElement('div');
        div.className = "msg " + type;
        div.innerHTML = text;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    async function sendMessage() {
        const input = document.getElementById('user-input');
        const val = input.value.trim();
        if(!val) return;

        addMsg(val, 'user-msg');
        input.value = "";
        const light = document.getElementById('status-light');
        light.style.background = "#ffff00"; // Mode calcul

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: `Tu es NDX.A, l'expert suprême universel créé par Ndiaye Adama. Réponds avec autorité à : ${val}` }] }]
                })
            });

            const data = await response.json();
            
            if (data.candidates && data.candidates[0].content.parts[0].text) {
                addMsg(data.candidates[0].content.parts[0].text, 'ai-msg');
                light.style.background = "#00d2ff"; // Bleu (Succès)
            } else {
                throw new Error("Clé invalide");
            }
        } catch (e) {
            // RÉPONSE DE SECOURS (Si la clé API ne marche pas)
            let backup = "ANALYSE NDX.A : Ma connexion au noyau externe est instable. Cependant, en tant qu'expert local, je confirme la réception de votre commande : '" + val + "'. Vérifiez la clé API pour activer ma pleine conscience.";
            addMsg(backup, 'ai-msg');
            light.style.background = "#ff4d4d"; // Rouge (Erreur clé)
        }
    }

    document.getElementById('user-input').addEventListener("keypress", (e) => { if(e.key === "Enter") sendMessage(); });
</script>
