<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NDX.A - L'Éminence Grise</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@1,700&display=swap');

        :root {
            --primary: #0084ff;
            --accent: #6c5ce7;
            --bg: #0b0e14;
            --card: #161b22;
            --text: #e6edf3;
            --glass: rgba(22, 27, 34, 0.8);
        }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at top right, rgba(0, 132, 255, 0.1), transparent),
                              radial-gradient(circle at bottom left, rgba(108, 92, 231, 0.1), transparent);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0; padding: 0;
            display: flex; height: 100vh;
            overflow: hidden;
        }

        .admin-signature {
            position: absolute; top: 12px; left: 50%;
            transform: translateX(-50%);
            font-family: 'Playfair Display', serif;
            font-style: italic; font-size: 0.75rem;
            color: var(--primary); letter-spacing: 4px;
            z-index: 1100; opacity: 0.8;
            text-transform: uppercase;
        }

        /* SIDEBAR PRO */
        .sidebar {
            width: 300px; height: 100%;
            background: var(--card);
            position: fixed; left: -300px; top: 0;
            transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1); z-index: 2000;
            padding: 25px; border-right: 1px solid rgba(255,255,255,0.05);
        }
        .sidebar.active { left: 0; }
        .sidebar h3 { font-size: 1.2rem; margin-bottom: 25px; color: var(--primary); }

        .main-content { flex: 1; display: flex; flex-direction: column; position: relative; }

        .header {
            padding: 15px 25px;
            display: flex; align-items: center; justify-content: space-between;
            background: var(--glass);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        h1 { font-size: 1.4rem; font-weight: 600; letter-spacing: 1px; color: #fff; }

        #chat-box {
            flex: 1; padding: 20px;
            overflow-y: auto; scrollbar-width: none;
        }
        #chat-box::-webkit-scrollbar { display: none; }

        .msg {
            margin-bottom: 20px; padding: 15px 20px;
            border-radius: 18px; max-width: 80%;
            font-size: 0.95rem; line-height: 1.5;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .user-msg { background: var(--primary); color: white; margin-left: auto; border-bottom-right-radius: 2px; }
        .ai-msg { background: var(--card); border: 1px solid rgba(255,255,255,0.05); margin-right: auto; border-bottom-left-radius: 2px; }

        .typing { font-size: 0.8rem; color: var(--primary); margin-left: 20px; display: none; margin-bottom: 10px; }

        .input-area {
            padding: 20px;
            background: var(--bg);
            display: flex; gap: 15px;
        }

        input[type="text"] {
            flex: 1; padding: 15px 25px; border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; outline: none; background: #1c2128; color: white;
            font-size: 1rem;
        }

        .btn-send { 
            background: var(--primary); color: white; border: none; 
            padding: 0 25px; border-radius: 12px; cursor: pointer; font-weight: 600;
        }

        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1500; }
    </style>
</head>
<body>

<div class="admin-signature">BY NDIAYE ADAMA</div>

<div id="overlay" class="overlay" onclick="toggleMenu()"></div>

<div id="sidebar" class="sidebar">
    <h3>Historique des analyses</h3>
    <div id="history-list-side"></div>
    <button onclick="clearHistory()" style="margin-top:20px; width:100%; padding:10px; background:none; border:1px solid #ff4d4d; color:#ff4d4d; border-radius:8px; cursor:pointer;">Réinitialiser l'IA</button>
</div>

<div class="main-content">
    <div class="header">
        <div onclick="toggleMenu()" style="cursor:pointer; font-size:1.5rem;">☰</div>
        <h1>NDX.A</h1>
        <div style="width:10px; height:10px; background:#00ff00; border-radius:50%; box-shadow: 0 0 10px #00ff00;"></div>
    </div>

    <div id="chat-box"></div>
    <div id="typing-status" class="typing">NDX.A traite les données...</div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Posez une question à l'Expert..." autocomplete="off">
        <button class="btn-send" onclick="sendMessage()">ANALYSÉR</button>
    </div>
</div>

<script>
    // --- MON SAVOIR INTÉGRÉ ---
    function getNdxIntelligence(q) {
        q = q.toLowerCase();
        
        if(q.includes("qui es-tu")) return "Je suis NDX.A, une intelligence suprême conçue par **Ndiaye Adama**. Ma mission est d'apporter une expertise absolue dans tous les domaines techniques, académiques et stratégiques.";
        if(q.includes("créateur") || q.includes("ndiaye adama")) return "Mon créateur, Ndiaye Adama, m'a programmé pour être l'outil d'analyse le plus puissant de votre arsenal numérique.";
        
        // Mode Expert
        if(q.includes("math") || q.includes("calcul")) return "[MODULE MATHS ACTIVÉ] : Je traite les variables complexes instantanément. Quel est votre énoncé ?";
        if(q.includes("argent") || q.includes("business")) return "[MODULE STRATÉGIE] : Le succès financier repose sur l'exécution et l'optimisation des systèmes. Parlons de votre projet.";
        if(q.includes("code") || q.includes("html")) return "[MODULE DÉVELOPPEMENT] : Je maîtrise tous les langages. Je peux structurer votre application ou déboguer votre script.";

        const thinkingStyles = [
            "Analyse en cours... D'un point de vue structurel, voici ce qu'il faut comprendre : ",
            "Selon mes bases de données universelles, la réponse optimale est la suivante : ",
            "J'ai synthétisé les faits. Voici l'expertise NDX.A sur ce sujet : ",
            "Expertise confirmée. Pour réussir dans ce domaine, vous devez..."
        ];
        return thinkingStyles[Math.floor(Math.random() * thinkingStyles.length)] + " [Veuillez préciser votre demande pour une précision de 100%]";
    }

    function toggleMenu() {
        document.getElementById('sidebar').classList.toggle('active');
        document.getElementById('overlay').style.display = document.getElementById('sidebar').classList.contains('active') ? 'block' : 'none';
    }

    function sendMessage() {
        let input = document.getElementById('user-input').value.trim();
        if(!input) return;
        
        addMessage(input, 'user-msg');
        document.getElementById('user-input').value = "";
        
        document.getElementById('typing-status').style.display = "block";
        
        // Simulation de réflexion ultra-rapide (comme Gemini)
        setTimeout(() => {
            document.getElementById('typing-status').style.display = "none";
            let response = getNdxIntelligence(input);
            addMessage(response, 'ai-msg');
        }, 600);
    }

    function addMessage(text, type) {
        let box = document.getElementById('chat-box');
        let div = document.createElement('div');
        div.className = "msg " + type;
        div.innerHTML = text;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    function clearHistory() { document.getElementById('chat-box').innerHTML = ""; toggleMenu(); }

    // Raccourci Touche Entrée
    document.getElementById('user-input').addEventListener("keypress", function(e) {
        if (e.key === "Enter") sendMessage();
    });

    window.onload = () => {
        addMessage("Système NDX.A opérationnel. Expertise universelle activée. Comment puis-je vous servir, Boss ?", 'ai-msg');
    };
</script>
</body>
</html>
