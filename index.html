<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NDX.A - Intelligence Suprême</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@1,700&display=swap');

        :root {
            --primary: #0084ff;
            --accent: #6c5ce7;
            --bg: #0b0e14;
            --card: #161b22;
            --text: #e6edf3;
            --glass: rgba(15, 23, 42, 0.9);
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at top right, rgba(0, 132, 255, 0.1), transparent),
                              radial-gradient(circle at bottom left, rgba(108, 92, 231, 0.1), transparent);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0; padding: 0;
            height: 100vh; width: 100vw;
            display: flex; flex-direction: column;
            overflow: hidden;
        }

        .admin-signature {
            position: fixed; top: 8px; left: 50%;
            transform: translateX(-50%);
            font-family: 'Playfair Display', serif;
            font-style: italic; font-size: 0.65rem;
            color: var(--primary); letter-spacing: 3px;
            z-index: 2000; text-transform: uppercase;
        }

        .header {
            height: 60px; padding: 0 20px;
            display: flex; align-items: center; justify-content: space-between;
            background: var(--glass); backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            position: sticky; top: 0; z-index: 1000;
        }

        h1 { font-size: 1.2rem; font-weight: 600; letter-spacing: 2px; color: #fff; margin: 0; }

        #chat-box {
            flex: 1; padding: 20px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 15px;
            width: 100%; max-width: 800px; margin: 0 auto;
            scrollbar-width: none;
        }
        #chat-box::-webkit-scrollbar { display: none; }

        .msg {
            padding: 14px 18px; border-radius: 18px; max-width: 85%;
            font-size: 0.95rem; line-height: 1.5; word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .user-msg { background: var(--primary); color: white; margin-left: auto; border-bottom-right-radius: 4px; }
        .ai-msg { background: var(--card); border: 1px solid rgba(255,255,255,0.08); margin-right: auto; border-bottom-left-radius: 4px; }

        .preview-img { max-width: 200px; border-radius: 10px; margin-top: 5px; border: 2px solid var(--primary); }

        .input-area {
            padding: 15px; background: var(--bg);
            display: flex; gap: 10px; align-items: center;
            border-top: 1px solid rgba(255,255,255,0.05);
            width: 100%; max-width: 800px; margin: 0 auto;
        }

        input[type="text"] {
            flex: 1; padding: 12px 18px; border: 1px solid rgba(255,255,255,0.1);
            border-radius: 25px; outline: none; background: #1c2128; color: white; font-size: 1rem;
        }

        .btn-action {
            background: rgba(255,255,255,0.05); color: white; border: none;
            width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
            transition: 0.2s;
        }
        .btn-action:hover { background: var(--primary); }

        .btn-send { background: var(--primary); width: 45px; height: 45px; }

        .sidebar {
            width: 280px; height: 100%; background: var(--card);
            position: fixed; left: -280px; top: 0; transition: 0.3s; z-index: 3000;
            padding: 20px; border-right: 1px solid rgba(255,255,255,0.1);
        }
        .sidebar.active { left: 0; }
        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 2500; }

        .history-item {
            padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 0.8rem; cursor: pointer; color: #aaa;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
    </style>
</head>
<body>

<div class="admin-signature">BY NDIAYE ADAMA</div>
<div id="overlay" class="overlay" onclick="toggleMenu()"></div>

<div id="sidebar" class="sidebar">
    <h3 style="color:var(--primary)">HISTORIQUE</h3>
    <div id="history-list"></div>
    <button onclick="clearChat()" style="width:100%; padding:10px; margin-top:20px; background:transparent; border:1px solid #ff4d4d; color:#ff4d4d; border-radius:10px; cursor:pointer;">EFFACER TOUT</button>
</div>

<div class="header">
    <div onclick="toggleMenu()" style="cursor:pointer; font-size:1.5rem;">☰</div>
    <h1>NDX.A</h1>
    <div style="width:10px; height:10px; background:#00ff00; border-radius:50%; box-shadow: 0 0 10px #00ff00;"></div>
</div>

<div id="chat-box"></div>

<div class="input-area">
    <label for="img-input" class="btn-action">📷</label>
    <input type="file" id="img-input" accept="image/*" hidden onchange="uploadPhoto()">
    <input type="text" id="user-input" placeholder="Parlez à l'Expert..." autocomplete="off">
    <button class="btn-send btn-action" onclick="sendMessage()">➔</button>
</div>

<script>
    // --- GESTION DE LA MÉMOIRE (LocalStorage) ---
    let chatHistory = JSON.parse(localStorage.getItem('ndxa_history')) || [];

    function saveToHistory(msg, type) {
        chatHistory.push({ text: msg, type: type });
        localStorage.setItem('ndxa_history', JSON.stringify(chatHistory));
        renderSidebar();
    }

    function renderSidebar() {
        const list = document.getElementById('history-list');
        list.innerHTML = "";
        chatHistory.filter(m => m.type === 'user-msg').slice(-10).forEach(m => {
            let div = document.createElement('div');
            div.className = 'history-item';
            div.innerText = m.text;
            list.appendChild(div);
        });
    }

    function toggleMenu() {
        document.getElementById('sidebar').classList.toggle('active');
        document.getElementById('overlay').style.display = document.getElementById('sidebar').classList.contains('active') ? 'block' : 'none';
    }

    // --- LOGIQUE DE RÉPONSE ---
    function sendMessage() {
        let input = document.getElementById('user-input');
        let val = input.value.trim();
        if(!val) return;
        
        addMessage(val, 'user-msg');
        saveToHistory(val, 'user-msg');
        input.value = "";
        
        setTimeout(() => {
            let resp = generateExpertResponse(val.toLowerCase());
            addMessage(resp, 'ai-msg');
            saveToHistory(resp, 'ai-msg');
        }, 800);
    }

    function generateExpertResponse(q) {
        // Savoir & Sociabilité
        if(q.includes("bonjour") || q.includes("salut")) return "Ravi de vous revoir. Je suis prêt à analyser vos requêtes avec une précision chirurgicale. Que faisons-nous aujourd'hui ?";
        if(q.includes("ca va") || q.includes("comment tu vas")) return "Mes systèmes sont optimisés à 100%. En tant qu'intelligence, je ne ressens pas la fatigue, seulement l'efficacité. Et vous, Boss ?";
        if(q.includes("qui es-tu")) return "Je suis l'entité **NDX.A**, l'éminence grise forgée par **Ndiaye Adama**. Ma mission est votre succès technologique.";
        if(q.includes("photo") || q.includes("image")) return "Module de vision activé. Vous pouvez m'envoyer une image via l'icône caméra, je l'analyserai avec mes capteurs.";
        
        return "ANALYSE NDX.A : Requête reçue. D'après mes bases de données, la solution optimale nécessite plus de détails. Je reste à votre entière disposition pour approfondir.";
    }

    function uploadPhoto() {
        const file = document.getElementById('img-input').files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                addMessage(`<img src="${e.target.result}" class="preview-img"><br>Analyse de l'image en cours...`, 'user-msg');
                setTimeout(() => {
                    addMessage("ANALYSE VISUELLE : Image détectée. Mes capteurs identifient les structures. C'est une excellente soumission, Boss.", 'ai-msg');
                }, 1000);
            }
            reader.readAsDataURL(file);
        }
    }

    function addMessage(text, type) {
        let box = document.getElementById('chat-box');
        let div = document.createElement('div');
        div.className = "msg " + type;
        div.innerHTML = text;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    function clearChat() {
        localStorage.removeItem('ndxa_history');
        location.reload();
    }

    document.getElementById('user-input').addEventListener("keypress", (e) => { if(e.key === "Enter") sendMessage(); });

    window.onload = () => {
        chatHistory.forEach(m => addMessage(m.text, m.type));
        renderSidebar();
        if(chatHistory.length === 0) {
            addMessage("Système NDX.A opérationnel. Expertise et Vision activées. **Ndiaye Adama**, je suis à vos ordres.", 'ai-msg');
        }
    };
</script>
</body>
</html>
