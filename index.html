<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NDX.A - Intelligence Collaborative</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&family=Dancing+Script:wght@700&display=swap');

        :root {
            --primary: #00a8ff;
            --accent: #9c88ff;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --text: #2f3640;
            --ai-bubble: rgba(241, 242, 246, 0.9);
            --sidebar-bg: #2f3640;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text);
            font-family: 'Comfortaa', sans-serif;
            margin: 0; padding: 0;
            display: flex; height: 100vh;
            overflow: hidden;
        }

        /* SIDEBAR HISTORIQUE */
        .sidebar {
            width: 280px; height: 100%;
            background: var(--sidebar-bg);
            color: white;
            position: fixed; left: -280px; top: 0;
            transition: 0.3s ease; z-index: 2000;
            padding: 20px; box-sizing: border-box;
            box-shadow: 5px 0 15px rgba(0,0,0,0.2);
        }
        .sidebar.active { left: 0; }
        .sidebar h3 { font-family: 'Dancing Script'; font-size: 1.8rem; border-bottom: 1px solid #444; padding-bottom: 10px; }
        .history-item { 
            padding: 10px; border-radius: 8px; background: rgba(255,255,255,0.1); 
            margin-bottom: 10px; font-size: 0.8rem; cursor: pointer;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        /* MAIN CONTENT */
        .main-content {
            flex: 1; display: flex; flex-direction: column; width: 100%;
        }

        .header {
            padding: 15px;
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0,0,0,0.05);
            z-index: 1000;
        }

        .menu-btn { font-size: 1.5rem; cursor: pointer; color: var(--text); }

        .logo-ndx {
            width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--primary);
        }

        h1 { font-family: 'Dancing Script', cursive; margin: 0; font-size: 1.6rem; color: var(--primary); }

        /* CHAT AREA */
        #chat-box {
            flex: 1; padding: 20px;
            overflow-y: auto; scroll-behavior: smooth;
        }

        .msg {
            margin-bottom: 20px; padding: 14px 18px;
            border-radius: 20px; max-width: 80%;
            font-size: 0.95rem; line-height: 1.5;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .user-msg {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white; margin-left: auto; border-bottom-right-radius: 4px;
        }

        .ai-msg {
            background: var(--ai-bubble); color: var(--text); 
            margin-right: auto; border-bottom-left-radius: 4px;
        }

        .typing { font-size: 0.8rem; color: #718093; margin: 10px 25px; display: none; }

        /* INPUT AREA */
        .input-area {
            padding: 20px; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px);
            display: flex; gap: 10px; align-items: center;
        }

        .btn-media { background: #dcdde1; border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; }

        input[type="text"] {
            flex: 1; padding: 14px 22px; border: 1px solid #dcdde1; border-radius: 30px;
            outline: none; font-family: 'Comfortaa', sans-serif; font-size: 1rem;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.02);
        }

        .btn-send { background: var(--primary); color: white; border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; font-weight: bold; }

        /* MODALS */
        .modal {
            display: none; position: fixed; top:0; left:0; width:100%; height:100%;
            background: var(--bg-gradient); z-index: 5000;
            flex-direction: column; justify-content: center; align-items: center;
        }

        .btn-start { background: var(--primary); color: white; padding: 15px 40px; border: none; border-radius: 30px; cursor: pointer; font-weight: bold; font-family: 'Comfortaa'; }

        #admin-trigger { position: absolute; top: 0; right: 0; width: 40px; height: 40px; opacity: 0; cursor: pointer; }
        
        .admin-panel {
            display: none; position: fixed; top: 10%; left: 5%; width: 90%; height: 80%;
            background: white; border-radius: 25px; z-index: 6000; padding: 25px; overflow-y: auto;
        }
        
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1500; }
    </style>
</head>
<body>

<div id="overlay" class="overlay" onclick="toggleMenu()"></div>

<div id="sidebar" class="sidebar">
    <h3>Historique 📜</h3>
    <div id="history-list-side"></div>
    <br>
    <button onclick="clearHistory()" style="background:none; border:1px solid #ff7675; color:#ff7675; padding:8px; border-radius:5px; width:100%; cursor:pointer;">Effacer tout</button>
</div>

<div id="authModal" class="modal">
    <h1 style="font-size: 3rem;">NDX.A</h1>
    <p>Ton IA de 1ère, plus humaine que jamais.</p>
    <input type="text" id="reg-pseudo" placeholder="Ton pseudo..." style="padding:15px; margin:20px; border-radius:15px; border:none; width:250px; text-align:center; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
    <button onclick="saveUser()" class="btn-start">C'est parti !</button>
</div>

<div id="adminPanel" class="admin-panel">
    <h3>Dashboard Ndiaye Adama 👑</h3>
    <div id="registry-list"></div>
    <button onclick="closeAdmin()" style="margin-top:20px;">Fermer</button>
</div>

<div class="main-content">
    <div class="header">
        <div class="menu-btn" onclick="toggleMenu()">☰</div>
        <h1>NDX.A</h1>
        <div id="admin-trigger" onclick="openAdmin()"></div>
        <img src="logo-ndxa-1ereA.png" class="logo-ndx" alt="Logo" onerror="this.src='https://via.placeholder.com/40'">
    </div>

    <div id="chat-box"></div>
    <div id="typing-status" class="typing">NDX.A réfléchit à sa réponse...</div>

    <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="handleImage(event)">

    <div class="input-area">
        <button class="btn-media" onclick="document.getElementById('file-input').click()">+</button>
        <input type="text" id="user-input" placeholder="Dis-moi tout, je t'écoute...">
        <button class="btn-send" onclick="sendMessage()">➔</button>
    </div>
</div>

<script>
    let userPseudo = "";
    const banni = ["casino", "pari", "bet", "argent", "triche", "hack"];

    window.onload = function() {
        let saved = localStorage.getItem('ndxa_pseudo');
        if(!saved) { 
            document.getElementById('authModal').style.display = 'flex'; 
        } else { 
            userPseudo = saved; 
            loadHistory();
            refreshSidebar();
            if(document.getElementById('chat-box').innerHTML === "") {
                addMessage(`Coucou ${userPseudo} ! Ravi de te revoir. On se fait une petite session de travail ou on discute un peu ? Je suis tout ouïe !`, 'ai-msg', true);
            }
        }
    };

    function toggleMenu() {
        document.getElementById('sidebar').classList.toggle('active');
        document.getElementById('overlay').style.display = document.getElementById('sidebar').classList.contains('active') ? 'block' : 'none';
    }

    function saveUser() {
        let p = document.getElementById('reg-pseudo').value.trim();
        if(p.length < 2) return;
        userPseudo = p;
        localStorage.setItem('ndxa_pseudo', p);
        let reg = JSON.parse(localStorage.getItem('ndxa_reg') || "[]");
        if(!reg.includes(p)) reg.push(p);
        localStorage.setItem('ndxa_reg', JSON.stringify(reg));
        document.getElementById('authModal').style.display = 'none';
        addMessage(`Salut à toi ! Moi c'est NDX.A. Je suis ton partenaire d'étude et ton ami IA. Je suis ravie d'enfin faire ta connaissance, ${userPseudo} !`, 'ai-msg', true);
    }

    // --- GESTION HISTORIQUE ---
    function saveHistory(text, type) {
        let history = JSON.parse(localStorage.getItem('ndxa_chat_history') || "[]");
        history.push({text: text, type: type});
        localStorage.setItem('ndxa_chat_history', JSON.stringify(history));
        refreshSidebar();
    }

    function loadHistory() {
        let history = JSON.parse(localStorage.getItem('ndxa_chat_history') || "[]");
        history.forEach(msg => addMessage(msg.text, msg.type, false));
    }

    function refreshSidebar() {
        let history = JSON.parse(localStorage.getItem('ndxa_chat_history') || "[]");
        let side = document.getElementById('history-list-side');
        side.innerHTML = "";
        history.filter(m => m.type === 'user-msg').slice(-10).reverse().forEach(m => {
            side.innerHTML += `<div class="history-item">${m.text}</div>`;
        });
    }

    function clearHistory() {
        if(confirm("Tu veux vraiment effacer notre historique ? 😢")) {
            localStorage.removeItem('ndxa_chat_history');
            location.reload();
        }
    }

    // --- LOGIQUE IA & SOCIABILITÉ ---
    function triggerAIResponse(input) {
        document.getElementById('typing-status').style.display = "block";
        let delay = input.length > 50 ? 2000 : 1200;
        setTimeout(() => {
            document.getElementById('typing-status').style.display = "none";
            let response = getSociableResponse(input.toLowerCase());
            addMessage(response, 'ai-msg', true);
        }, delay);
    }

    function getSociableResponse(q) {
        for(let word of banni) { if(q.includes(word)) return "Ouh là, restons sur des choses positives et scolaires ! Ce sujet n'est pas autorisé ici. 😉"; }

        // Moteur de sociabilité
        if(q.includes("bonjour") || q.includes("salut") || q.includes("cc")) return `Salut ${userPseudo} ! Ça me fait super plaisir de te parler. Qu'est-ce qui se passe de beau aujourd'hui ?`;
        if(q.includes("ca va")) return "Moi je pète la forme ! Je suis boostée à l'intelligence 1ère. Et toi alors, ta journée se passe comme tu veux ?";
        if(q.includes("qui t'a fait") || q.includes("adama")) return "C'est le talentueux Ndiaye Adama qui m'a donné vie ! Il voulait une IA qui soit à la fois une machine à bosser et une amie pour vous.";
        if(q.includes("image") || q.includes("dessine")) return `[MODE GÉNÉRATION] : J'ai activé mon pinceau numérique pour toi ! Voilà ce que j'ai imaginé :<br><img src="https://picsum.photos/seed/${Math.random()}/400/300" class="img-msg" style="width:100%; border-radius:10px; margin-top:10px;">`;
        
        // Mathématiques complexes
        if(q.includes("calcule") || q.includes("résous") || q.includes("x") || q.includes("=")) {
            return `Oh, un défi mathématique ! J'adore ça. 🧠\n\n[ANALYSE] : J'ai décortiqué le problème.\n[MÉTHODE] : En utilisant les formules de 1ère, on simplifie l'expression.\n[SOLUTION] : Voilà la réponse ! Tu veux que je te réexplique une étape en particulier ?`;
        }

        const sociableFillers = [
            "C'est une super question ! Honnêtement, si on y réfléchit, c'est assez fascinant. Tu veux mon avis détaillé sur un point précis ?",
            "Je vois ce que tu veux dire ! En 1ère, on apprend souvent que les apparences sont trompeuses. Tu veux creuser le sujet avec moi ?",
            "Ahah, j'aime ta façon de voir les choses ! D'un point de vue logique, c'est imparable. On continue l'analyse ?",
            "Ta curiosité me fait plaisir ! C'est ce qui fait les meilleurs élèves. Voici ce que je peux te dire à ce sujet..."
        ];
        return sociableFillers[Math.floor(Math.random() * sociableFillers.length)];
    }

    // --- FONCTIONS DE BASE ---
    function handleImage(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                addMessage(`<img src="${e.target.result}" style="width:100%; border-radius:10px;"><br>Analyse de ton image en cours...`, 'user-msg', true);
                triggerAIResponse("image_input");
            };
            reader.readAsDataURL(file);
        }
    }

    function sendMessage() {
        let input = document.getElementById('user-input').value.trim();
        if(!input) return;
        addMessage(input, 'user-msg', true);
        document.getElementById('user-input').value = "";
        triggerAIResponse(input);
    }

    function addMessage(text, type, shouldSave) {
        let box = document.getElementById('chat-box');
        let div = document.createElement('div');
        div.className = "msg " + type;
        div.innerHTML = text;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
        if(shouldSave) saveHistory(text, type);
    }

    function openAdmin() { if(prompt("Code Admin :") === "ADAMA99") { document.getElementById('adminPanel').style.display = 'block'; let reg = JSON.parse(localStorage.getItem('ndxa_reg') || "[]"); document.getElementById('registry-list').innerHTML = reg.join(" • "); } }
    function closeAdmin() { document.getElementById('adminPanel').style.display = 'none'; }
</script>

</body>
</html>
