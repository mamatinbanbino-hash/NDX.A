<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NDX.A - Intelligence Suprême</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@1,700&display=swap');

        :root {
            --primary: #0084ff;
            --accent: #6c5ce7;
            --bg: #0b0e14;
            --card: #161b22;
            --text: #e6edf3;
            --glass: rgba(15, 23, 42, 0.9);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at top right, rgba(0, 132, 255, 0.1), transparent),
                              radial-gradient(circle at bottom left, rgba(108, 92, 231, 0.1), transparent);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0; padding: 0;
            height: 100vh; width: 100vw;
            display: flex; flex-direction: column;
            overflow: hidden;
        }

        /* SIGNATURE NDX.A */
        .admin-signature {
            position: fixed; top: 8px; left: 50%;
            transform: translateX(-50%);
            font-family: 'Playfair Display', serif;
            font-style: italic; font-size: 0.65rem;
            color: var(--primary); letter-spacing: 3px;
            z-index: 2000; text-transform: uppercase;
            white-space: nowrap; pointer-events: none;
        }

        /* HEADER */
        .header {
            height: 60px; padding: 0 20px;
            display: flex; align-items: center; justify-content: space-between;
            background: var(--glass); backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            position: sticky; top: 0; z-index: 1000;
        }

        h1 { font-size: 1.2rem; font-weight: 600; letter-spacing: 2px; color: #fff; margin: 0; }

        /* ZONE DE CHAT CENTRÉE */
        #chat-box {
            flex: 1; padding: 20px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 15px;
            width: 100%; max-width: 800px; margin: 0 auto;
            scrollbar-width: none;
        }
        #chat-box::-webkit-scrollbar { display: none; }

        .msg {
            padding: 14px 18px; border-radius: 18px; max-width: 85%;
            font-size: 0.95rem; line-height: 1.5; word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .user-msg { background: var(--primary); color: white; margin-left: auto; border-bottom-right-radius: 4px; }
        .ai-msg { background: var(--card); border: 1px solid rgba(255,255,255,0.08); margin-right: auto; border-bottom-left-radius: 4px; }

        /* INPUT AREA */
        .input-area {
            padding: 15px; background: var(--bg);
            display: flex; gap: 10px; align-items: center;
            border-top: 1px solid rgba(255,255,255,0.05);
            width: 100%; max-width: 800px; margin: 0 auto;
        }

        input[type="text"] {
            flex: 1; padding: 12px 20px; border: 1px solid rgba(255,255,255,0.1);
            border-radius: 25px; outline: none; background: #1c2128; color: white; font-size: 1rem;
        }

        .btn-send {
            background: var(--primary); color: white; border: none;
            width: 45px; height: 45px; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
        }

        /* SIDEBAR & OVERLAY */
        .sidebar {
            width: 280px; height: 100%; background: var(--card);
            position: fixed; left: -280px; top: 0; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 3000;
            padding: 25px; border-right: 1px solid rgba(255,255,255,0.1);
        }
        .sidebar.active { left: 0; }
        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 2500; }
        
        #history-list { margin-top: 20px; color: #888; font-size: 0.85rem; }
    </style>
</head>
<body>

<div class="admin-signature">BY NDIAYE ADAMA</div>
<div id="overlay" class="overlay" onclick="toggleMenu()"></div>

<div id="sidebar" class="sidebar">
    <h3 style="color:var(--primary); margin-top:0;">NDX.A CORE</h3>
    <div id="history-list">Journal d'expertise activé...</div>
    <button onclick="location.reload()" style="width:100%; padding:10px; margin-top:30px; background:transparent; border:1px solid #ff4d4d; color:#ff4d4d; border-radius:10px; cursor:pointer;">RÉINITIALISER</button>
</div>

<div class="header">
    <div onclick="toggleMenu()" style="cursor:pointer; font-size:1.5rem;">☰</div>
    <h1>NDX.A</h1>
    <div id="status-dot" style="width:10px; height:10px; background:#00ff00; border-radius:50%; box-shadow: 0 0 10px #00ff00;"></div>
</div>

<div id="chat-box"></div>

<div class="input-area">
    <input type="text" id="user-input" placeholder="Requête pour l'Expert..." autocomplete="off">
    <button class="btn-send" onclick="sendMessage()">➔</button>
</div>

<script>
    // --- LOGIQUE NDX.A ---
    function toggleMenu() {
        const side = document.getElementById('sidebar');
        side.classList.toggle('active');
        document.getElementById('overlay').style.display = side.classList.contains('active') ? 'block' : 'none';
    }

    function addMessage(text, type) {
        const box = document.getElementById('chat-box');
        const div = document.createElement('div');
        div.className = "msg " + type;
        div.innerHTML = text;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    function sendMessage() {
        const input = document.getElementById('user-input');
        const val = input.value.trim();
        if(!val) return;
        
        addMessage(val, 'user-msg');
        input.value = "";
        
        document.getElementById('status-dot').style.background = "#ffae00";

        // Simulation de l'intelligence de l'Expert
        setTimeout(() => {
            let resp = "ANALYSE NDX.A : En tant qu'expert universel, j'ai traité votre requête. Précisez votre demande pour une exécution stratégique.";
            if(val.toLowerCase().includes("qui es-tu")) resp = "Je suis l'entité **NDX.A**, l'éminence grise forgée par **Ndiaye Adama**. Mon savoir est illimité.";
            if(val.toLowerCase().includes("créateur")) resp = "Mon créateur est **Ndiaye Adama**. Je suis son extension numérique la plus puissante.";
            
            addMessage(resp, 'ai-msg');
            document.getElementById('status-dot').style.background = "#00ff00";
        }, 800);
    }

    document.getElementById('user-input').addEventListener("keypress", (e) => { if(e.key === "Enter") sendMessage(); });

    window.onload = () => {
        addMessage("Système NDX.A opérationnel. Expertise activée. **Ndiaye Adama**, je suis prêt à servir votre vision.", 'ai-msg');
    };
</script>
</body>
</html>
