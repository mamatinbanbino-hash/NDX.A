<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NDX.A - Intelligence Collaborative</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&family=Dancing+Script:wght@700&display=swap');

        :root {
            --primary: #00a8ff;
            --accent: #9c88ff;
            --bg: #ffffff;
            --text: #2f3640;
            --ai-bubble: #f1f2f6;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Comfortaa', sans-serif;
            margin: 0; padding: 0;
            display: flex; flex-direction: column; height: 100vh;
        }

        .header {
            padding: 15px;
            display: flex; align-items: center; justify-content: center;
            border-bottom: 1px solid #f1f2f6;
            position: relative;
            background: white; z-index: 10;
        }

        .logo-ndx {
            width: 45px; height: 45px;
            border-radius: 50%; margin-right: 12px;
            border: 2px solid var(--primary);
            object-fit: cover;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            margin: 0; font-size: 1.8rem; color: var(--primary);
        }

        #chat-box {
            flex: 1; padding: 20px;
            overflow-y: auto; background-color: #ffffff;
            scroll-behavior: smooth;
        }

        .msg {
            margin-bottom: 20px; padding: 14px 18px;
            border-radius: 20px; max-width: 85%;
            font-size: 0.95rem; line-height: 1.5;
            position: relative;
            animation: fadeIn 0.3s ease;
        }

        .img-msg {
            max-width: 200px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: block;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .user-msg {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white; margin-left: auto;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 10px rgba(0, 168, 255, 0.2);
        }

        .ai-msg {
            background-color: var(--ai-bubble);
            color: var(--text); margin-right: auto;
            border-bottom-left-radius: 4px;
        }

        .typing { font-size: 0.8rem; color: #a0a0a0; margin: 10px 25px; display: none; font-style: italic; }

        /* INPUT AREA UPGRADE */
        .input-area {
            padding: 15px; background: white;
            display: flex; gap: 10px; border-top: 1px solid #f1f2f6;
            align-items: center;
        }

        .btn-media {
            background: #f1f2f6; color: var(--text); border: none;
            width: 40px; height: 40px; border-radius: 50%;
            cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; justify-content: center;
        }

        input[type="text"] {
            flex: 1; padding: 12px 18px;
            border: 2px solid #f1f2f6; border-radius: 30px;
            outline: none; font-family: 'Comfortaa', sans-serif;
            font-size: 0.9rem;
        }

        .btn-send {
            background: var(--primary); color: white; border: none;
            width: 40px; height: 40px; border-radius: 50%;
            cursor: pointer; font-size: 1rem;
        }

        .modal {
            display: none; position: fixed;
            top:0; left:0; width:100%; height:100%;
            background: white; z-index: 3000;
            flex-direction: column; justify-content: center; align-items: center;
        }

        #admin-trigger { position: absolute; top: 0; right: 0; width: 40px; height: 40px; opacity: 0; cursor: pointer; }
        
        .admin-panel {
            display: none; position: fixed;
            top: 10%; left: 5%; width: 90%; height: 80%;
            background: white; border-radius: 25px;
            z-index: 4000; padding: 25px; overflow-y: auto; box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<div id="authModal" class="modal">
    <h1>NDX.A</h1>
    <p style="color: #7f8c8d;">Intelligence Collaborative & Vision.</p>
    <input type="text" id="reg-pseudo" placeholder="Pseudo..." style="padding:15px; margin:25px; border-radius:15px; border:2px solid #eee; width:200px; text-align:center;">
    <button onclick="saveUser()" style="background:var(--primary); color:white; padding:12px 30px; border:none; border-radius:25px; cursor:pointer;">Lancer NDX.A</button>
</div>

<div id="adminPanel" class="admin-panel">
    <h3>Dashboard Adama 👑</h3>
    <div id="registry-list"></div>
    <button onclick="closeAdmin()" style="margin-top:20px;">Fermer</button>
</div>

<div class="header">
    <div id="admin-trigger" onclick="openAdmin()"></div>
    <img src="logo-ndxa-1ereA.png" class="logo-ndx" alt="Logo" onerror="this.src='https://via.placeholder.com/50'">
    <h1>NDX.A</h1>
</div>

<div id="chat-box">
    <div class="msg ai-msg">Systèmes opérationnels. Je suis NDX.A. Mes capteurs visuels et mon moteur de précision sont activés. Comment puis-je vous assister ?</div>
</div>
<div id="typing-status" class="typing">NDX.A traite les données...</div>

<input type="file" id="file-input" accept="image/*" style="display: none;" onchange="handleImage(event)">

<div class="input-area">
    <button class="btn-media" onclick="document.getElementById('file-input').click()">+</button>
    <input type="text" id="user-input" placeholder="Message ou analyse d'image...">
    <button class="btn-send" onclick="sendMessage()">➔</button>
</div>

<script>
    let userPseudo = "";
    const forbidden = ["casino", "pari", "bet", "argent", "triche", "hack"];

    window.onload = function() {
        let saved = localStorage.getItem('ndxa_pseudo');
        if(!saved) { document.getElementById('authModal').style.display = 'flex'; }
        else { userPseudo = saved; }
    };

    function saveUser() {
        let p = document.getElementById('reg-pseudo').value.trim();
        if(p.length < 2) return;
        userPseudo = p;
        localStorage.setItem('ndxa_pseudo', p);
        let reg = JSON.parse(localStorage.getItem('ndxa_reg') || "[]");
        if(!reg.includes(p)) reg.push(p);
        localStorage.setItem('ndxa_reg', JSON.stringify(reg));
        document.getElementById('authModal').style.display = 'none';
        addMessage(`Bienvenue ${userPseudo}. Précision analytique activée.`, 'ai-msg');
    }

    // GESTION IMAGE
    function handleImage(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const box = document.getElementById('chat-box');
                const div = document.createElement('div');
                div.className = "msg user-msg";
                div.innerHTML = `<img src="${e.target.result}" class="img-msg"><br>Analyse cette image...`;
                box.appendChild(div);
                box.scrollTop = box.scrollHeight;
                
                triggerAIResponse("image_input");
            };
            reader.readAsDataURL(file);
        }
    }

    function sendMessage() {
        let input = document.getElementById('user-input').value.trim();
        if(!input) return;
        addMessage(input, 'user-msg');
        document.getElementById('user-input').value = "";
        triggerAIResponse(input);
    }

    function triggerAIResponse(input) {
        document.getElementById('typing-status').style.display = "block";
        setTimeout(() => {
            document.getElementById('typing-status').style.display = "none";
            let response = getPreciseResponse(input.toLowerCase());
            addMessage(response, 'ai-msg');
        }, 1800);
    }

    function addMessage(text, type) {
        let box = document.getElementById('chat-box');
        let div = document.createElement('div');
        div.className = "msg " + type;
        div.innerText = text;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    function getPreciseResponse(q) {
        if(q === "image_input") return "[ANALYSE VISUELLE] : Image reçue. Les données pixel indiquent un contenu lié à votre environnement. En tant qu'IA, je recommande d'associer cette image à une question précise pour une analyse circonscrite.";

        for(let word of forbidden) { if(q.includes(word)) return "ALERTE SÉCURITÉ : Thématique non-éducative détectée. Accès refusé."; }

        if(q.includes("ndiaye") || q.includes("adama")) return "IDENTIFICATION : Ndiaye Adama est l'administrateur système et créateur de NDX.A.";

        // Réponses circonscrites (Structure : Fait -> Analyse -> Conseil)
        const preciseFillers = [
            "RÉPONSE ANALYTIQUE : Votre requête porte sur un concept clé de 1ère. \n\n1. Faits : Le sujet est lié aux programmes officiels. \n2. Analyse : Il nécessite une approche rigoureuse. \n3. Conseil : Consultez vos fiches de révision pour valider ces points.",
            "PRÉCISION NDX.A : D'après mon moteur de réflexion, cette question doit être traitée par étapes. Voulez-vous que je circonscrive la réponse au domaine littéraire ou scientifique ?",
            "MÉTHODOLOGIE : Pour répondre sans erreur, j'ai segmenté votre demande. Voici la conclusion logique : une application stricte des règles de cours donnera le meilleur résultat."
        ];

        return preciseFillers[Math.floor(Math.random() * preciseFillers.length)];
    }

    function openAdmin() {
        if(prompt("Code Admin :") === "ADAMA99") {
            document.getElementById('adminPanel').style.display = 'block';
            let reg = JSON.parse(localStorage.getItem('ndxa_reg') || "[]");
            document.getElementById('registry-list').innerHTML = reg.join(" • ");
        }
    }
    function closeAdmin() { document.getElementById('adminPanel').style.display = 'none'; }
</script>

</body>
</html>
