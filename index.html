<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NDX.A - Intelligence Universelle</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&family=Dancing+Script:wght@700&family=Playfair+Display:ital,wght@1,700&display=swap');

        :root {
            --primary: #00a8ff;
            --accent: #9c88ff;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #d6e0f0 100%);
            --text: #2f3640;
            --ai-bubble: rgba(255, 255, 255, 0.7);
            --sidebar-bg: #1e272e;
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text);
            font-family: 'Comfortaa', sans-serif;
            margin: 0; padding: 0;
            display: flex; height: 100vh;
            overflow: hidden;
        }

        .admin-signature {
            position: absolute;
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 0.8rem;
            color: var(--accent);
            letter-spacing: 2px;
            z-index: 1100;
            pointer-events: none;
        }

        /* SIDEBAR */
        .sidebar {
            width: 280px; height: 100%;
            background: var(--sidebar-bg);
            color: white;
            position: fixed; left: -280px; top: 0;
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 2000;
            padding: 20px; box-sizing: border-box;
            box-shadow: 10px 0 30px rgba(0,0,0,0.3);
        }
        .sidebar.active { left: 0; }
        .sidebar h3 { font-family: 'Dancing Script'; font-size: 2rem; border-bottom: 1px solid #3d4e5e; padding-bottom: 15px; margin-bottom: 20px; color: var(--primary); }
        .history-item { 
            padding: 12px; border-radius: 12px; background: rgba(255,255,255,0.05); 
            margin-bottom: 12px; font-size: 0.85rem; cursor: pointer;
            transition: 0.3s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            border-left: 3px solid transparent;
        }

        /* MAIN CONTENT */
        .main-content {
            flex: 1; display: flex; flex-direction: column; width: 100%; position: relative;
        }

        .header {
            padding: 15px 20px;
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255,255,255,0.3);
            z-index: 1000;
            margin-top: 10px;
        }

        .menu-btn { font-size: 1.8rem; cursor: pointer; color: var(--text); }

        .logo-ndx {
            width: 42px; height: 42px; border-radius: 50%; border: 2px solid var(--primary);
        }

        h1 { font-family: 'Dancing Script', cursive; margin: 0; font-size: 1.8rem; color: var(--primary); }

        /* ZONE DE DISCUSSION TRANSPARENTE */
        #chat-box {
            flex: 1; padding: 20px;
            overflow-y: auto; scroll-behavior: smooth;
            background: rgba(255, 255, 255, 0.15); /* Transparence du fond */
            backdrop-filter: blur(10px); /* Effet de flou sur le fond d'écran */
            -webkit-backdrop-filter: blur(10px);
        }

        .msg {
            margin-bottom: 25px; padding: 16px 20px;
            border-radius: 22px; max-width: 85%;
            font-size: 0.95rem; line-height: 1.6;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .user-msg {
            background: linear-gradient(135deg, rgba(0, 168, 255, 0.9), rgba(156, 136, 255, 0.9));
            color: white; margin-left: auto; border-bottom-right-radius: 4px;
        }

        .ai-msg {
            background: var(--ai-bubble); 
            backdrop-filter: blur(5px);
            color: var(--text); 
            margin-right: auto; border-bottom-left-radius: 4px;
            border: 1px solid rgba(255,255,255,0.5);
        }

        .typing { font-size: 0.85rem; color: #7f8c8d; margin: 0 25px 15px; display: none; font-style: italic; }

        /* INPUT AREA */
        .input-area {
            padding: 20px; 
            background: rgba(255, 255, 255, 0.3); 
            backdrop-filter: blur(20px);
            display: flex; gap: 12px; align-items: center;
            border-top: 1px solid rgba(255,255,255,0.2);
        }

        .btn-media { 
            background: rgba(255,255,255,0.6); border: none; width: 48px; height: 48px; border-radius: 50%; 
            cursor: pointer; font-size: 1.4rem; color: var(--primary);
        }

        input[type="text"] {
            flex: 1; padding: 15px 25px; border: none; border-radius: 30px;
            outline: none; font-family: 'Comfortaa', sans-serif; font-size: 1rem;
            background: rgba(255, 255, 255, 0.8); 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .btn-send { 
            background: var(--primary); color: white; border: none; width: 48px; height: 48px; 
            border-radius: 50%; cursor: pointer;
        }

        /* MODALS & OVERLAY */
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); z-index: 1500; }
        
        .admin-panel {
            display: none; position: fixed; top: 10%; left: 5%; width: 90%; height: 80%;
            background: white; border-radius: 30px; z-index: 6000; padding: 30px; overflow-y: auto;
        }
        
        #admin-trigger { position: absolute; top: 0; right: 0; width: 50px; height: 50px; opacity: 0; cursor: pointer; z-index: 1001; }
    </style>
</head>
<body>

<div class="admin-signature">BY NDIAYE ADAMA</div>

<div id="overlay" class="overlay" onclick="toggleMenu()"></div>

<div id="sidebar" class="sidebar">
    <h3>Historique 📜</h3>
    <div id="history-list-side"></div>
    <br>
    <button onclick="clearHistory()" style="background:rgba(255,118,117,0.1); border:1px solid #ff7675; color:#ff7675; padding:12px; border-radius:15px; width:100%; cursor:pointer;">Effacer la mémoire</button>
</div>

<div id="adminPanel" class="admin-panel">
    <h2 style="font-family:'Dancing Script';">Dashboard Ndiaye Adama 👑</h2>
    <div id="registry-list"></div>
    <button onclick="closeAdmin()">Fermer</button>
</div>

<div class="main-content">
    <div class="header">
        <div class="menu-btn" onclick="toggleMenu()">☰</div>
        <h1>NDX.A</h1>
        <div id="admin-trigger" onclick="openAdmin()"></div>
        <img src="logo-ndxa-1ereA.png" class="logo-ndx" alt="Logo" onerror="this.src='https://via.placeholder.com/42'">
    </div>

    <div id="chat-box"></div>
    <div id="typing-status" class="typing">NDX.A parcourt sa base mondiale...</div>

    <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="handleImage(event)">

    <div class="input-area">
        <button class="btn-media" onclick="document.getElementById('file-input').click()">+</button>
        <input type="text" id="user-input" placeholder="Pose-moi une question universelle...">
        <button class="btn-send" onclick="sendMessage()">➔</button>
    </div>
</div>

<script>
    let userPseudo = "Élève de 1ère";
    const banni = ["casino", "pari", "bet", "argent", "triche", "hack"];

    window.onload = function() {
        let saved = localStorage.getItem('ndxa_pseudo');
        if(saved) userPseudo = saved;
        loadHistory();
        refreshSidebar();
        if(document.getElementById('chat-box').innerHTML === "") {
            addMessage(`Système NDX.A prêt. Interface Transparente activée. Je dispose d'une omniscience mondiale sur les pays, les sports et les métiers. Comment puis-je t'aider ?`, 'ai-msg', true);
        }
    };

    function toggleMenu() {
        document.getElementById('sidebar').classList.toggle('active');
        document.getElementById('overlay').style.display = document.getElementById('sidebar').classList.contains('active') ? 'block' : 'none';
    }

    function triggerAIResponse(input) {
        document.getElementById('typing-status').style.display = "block";
        setTimeout(() => {
            document.getElementById('typing-status').style.display = "none";
            let response = getOmniscientResponse(input.toLowerCase());
            addMessage(response, 'ai-msg', true);
        }, 1800);
    }

    function getOmniscientResponse(q) {
        for(let word of banni) { if(q.includes(word)) return "Sujet restreint par les protocoles éducatifs mondiaux."; }
        if(q.includes("prompt")) return "[SYSTÈME PROMPT] : Analyse de vos instructions en cours...";
        if(q.includes("pays") || q.includes("monde")) return "[OMNISCIENCE MONDIALE] : Ma base de données couvre les 195 pays du globe.";
        if(q.includes("sport")) return "[ANALYSE SPORTIVE] : Je suis informé sur toutes les disciplines mondiales.";
        if(q.includes("travail") || q.includes("métier")) return "[CARRIÈRE] : Je connais les rouages des métiers physiques et digitaux.";
        if(q.includes("salut") || q.includes("bonjour")) return `Bonjour. Je suis NDX.A. Sur quel domaine allons-nous travailler ?`;
        
        const answers = [
            "Analyse universelle terminée. Voici mon rapport...",
            "D'un point de vue global, voici les détails...",
            "Requête traitée par le moteur NDX.A.",
            "Voici l'angle d'approche que je suggère pour ce sujet..."
        ];
        return answers[Math.floor(Math.random() * answers.length)];
    }

    function saveHistory(text, type) {
        let history = JSON.parse(localStorage.getItem('ndxa_chat_history') || "[]");
        history.push({text: text, type: type});
        localStorage.setItem('ndxa_chat_history', JSON.stringify(history));
        refreshSidebar();
    }

    function loadHistory() {
        let history = JSON.parse(localStorage.getItem('ndxa_chat_history') || "[]");
        history.forEach(msg => addMessage(msg.text, msg.type, false));
    }

    function refreshSidebar() {
        let history = JSON.parse(localStorage.getItem('ndxa_chat_history') || "[]");
        let side = document.getElementById('history-list-side');
        side.innerHTML = "";
        history.filter(m => m.type === 'user-msg').slice(-10).reverse().forEach(m => {
            let item = document.createElement('div');
            item.className = 'history-item';
            item.innerText = m.text;
            side.appendChild(item);
        });
    }

    function clearHistory() {
        if(confirm("Effacer la mémoire universelle ?")) {
            localStorage.removeItem('ndxa_chat_history');
            location.reload();
        }
    }

    function handleImage(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                addMessage(`<img src="${e.target.result}" style="width:100%; border-radius:15px;"><br>Analyse visuelle lancée...`, 'user-msg', true);
                triggerAIResponse("image_input");
            };
            reader.readAsDataURL(file);
        }
    }

    function sendMessage() {
        let input = document.getElementById('user-input').value.trim();
        if(!input) return;
        addMessage(input, 'user-msg', true);
        document.getElementById('user-input').value = "";
        triggerAIResponse(input);
    }

    function addMessage(text, type, shouldSave) {
        let box = document.getElementById('chat-box');
        let div = document.createElement('div');
        div.className = "msg " + type;
        div.innerHTML = text;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
        if(shouldSave) saveHistory(text, type);
    }

    function openAdmin() { if(prompt("Code Admin :") === "ADAMA99") { document.getElementById('adminPanel').style.display = 'block'; let reg = JSON.parse(localStorage.getItem('ndxa_reg') || "[]"); document.getElementById('registry-list').innerHTML = reg.join(" • "); } }
    function closeAdmin() { document.getElementById('adminPanel').style.display = 'none'; }
</script>

</body>
</html>
