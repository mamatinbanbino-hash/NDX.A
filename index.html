<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NDX.A - Intelligence de Contrôle</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap');

        :root {
            --primary: #00d2ff;
            --secondary: #3a7bd5;
            --bg: #05070a;
            --card: rgba(22, 27, 34, 0.7);
            --neon: 0 0 15px rgba(0, 210, 255, 0.4);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg);
            background-image: 
                linear-gradient(rgba(0, 210, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 210, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            color: #fff;
            font-family: 'Inter', sans-serif;
            margin: 0; height: 100vh; display: flex; flex-direction: column;
            overflow: hidden;
        }

        /* SIGNATURE CYBER */
        .admin-signature {
            position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
            font-family: 'Orbitron', sans-serif; font-size: 0.7rem; font-weight: 700;
            color: var(--primary); letter-spacing: 5px; z-index: 2000;
            text-shadow: var(--neon); text-transform: uppercase;
        }

        /* HEADER PRO */
        .header {
            height: 70px; padding: 0 25px;
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(15px);
            border-bottom: 2px solid var(--primary);
            box-shadow: var(--neon);
        }

        .header h1 { font-family: 'Orbitron', sans-serif; font-size: 1.4rem; letter-spacing: 4px; color: #fff; margin: 0; }

        /* CHAT ZONE */
        #chat-box {
            flex: 1; padding: 25px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 20px;
            width: 100%; max-width: 900px; margin: 0 auto;
            scrollbar-width: none;
        }
        #chat-box::-webkit-scrollbar { display: none; }

        .msg {
            padding: 18px 24px; border-radius: 15px; max-width: 85%;
            font-size: 0.95rem; line-height: 1.6; position: relative;
            backdrop-filter: blur(5px); transition: 0.3s;
        }

        .user-msg {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #000; font-weight: 600; margin-left: auto;
            border-bottom-right-radius: 2px; box-shadow: var(--neon);
        }

        .ai-msg {
            background: var(--card); border: 1px solid rgba(0, 210, 255, 0.2);
            margin-right: auto; border-bottom-left-radius: 2px;
        }

        .ai-msg::before {
            content: "SYSTEM ANALYSIS"; position: absolute; top: -18px; left: 0;
            font-family: 'Orbitron'; font-size: 0.6rem; color: var(--primary);
        }

        /* INPUT AREA */
        .input-area {
            padding: 25px; background: rgba(0, 0, 0, 0.9);
            display: flex; gap: 15px; align-items: center;
            border-top: 1px solid var(--primary);
        }

        input[type="text"] {
            flex: 1; padding: 15px 25px; border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 5px; background: rgba(255, 255, 255, 0.05); color: #fff;
            font-family: 'Orbitron', sans-serif; font-size: 0.9rem; outline: none;
            transition: 0.3s;
        }
        input[type="text"]:focus { border-color: var(--primary); box-shadow: var(--neon); }

        .btn-send {
            background: var(--primary); color: #000; border: none;
            width: 50px; height: 50px; border-radius: 5px; cursor: pointer;
            font-weight: bold; font-size: 1.2rem; transition: 0.3s;
        }
        .btn-send:hover { transform: scale(1.1); box-shadow: var(--neon); }

        /* STATUS */
        #status-light {
            width: 12px; height: 12px; border-radius: 50%;
            background: var(--primary); box-shadow: var(--neon);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div class="admin-signature">BY NDIAYE ADAMA</div>

<div class="header">
    <div style="cursor:pointer; font-size:1.5rem; color: var(--primary);">☰</div>
    <h1>NDX.A</h1>
    <div id="status-light"></div>
</div>

<div id="chat-box"></div>

<div class="input-area">
    <input type="text" id="user-input" placeholder="ENTRER COMMANDE..." autocomplete="off">
    <button class="btn-send" onclick="sendMessage()">></button>
</div>

<script>
    const API_KEY = ""; // Ta clé sk-proj-...

    function addMsg(text, type) {
        const box = document.getElementById('chat-box');
        const div = document.createElement('div');
        div.className = "msg " + type;
        div.innerHTML = text;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    async function sendMessage() {
        const input = document.getElementById('user-input');
        const val = input.value.trim();
        if(!val) return;

        addMsg(val, 'user-msg');
        input.value = "";
        
        // Simulation de calcul
        document.getElementById('status-light').style.background = "#ffff00";

        setTimeout(async () => {
            let response = "";
            if (!API_KEY) {
                // Intelligence Locale Optimisée
                if(val.toLowerCase().includes("qui es-tu")) {
                    response = "**IDENTIFICATION :** NDX.A<br>**ORIGINE :** Ndiaye Adama<br>**STATUS :** Expert Suprême Universel.<br>**MISSION :** Domination technologique.";
                } else if(val.toLowerCase().includes("cours") || val.toLowerCase().includes("math")) {
                    response = "[MODULE ACADÉMIQUE ACTIVÉ]<br>Analyse de la requête en cours... Je suis prêt à transmettre tout le savoir mondial. Quel est votre sujet ?";
                } else {
                    response = "[ANALYSE TERMINÉE]<br>Résultat : Données reçues. Précisez la commande pour une exécution à 100%.";
                }
            } else {
                // Ici tu peux ajouter l'appel API OpenAI si tu as une clé
            }
            
            addMsg(response, 'ai-msg');
            document.getElementById('status-light').style.background = "#00d2ff";
        }, 1000);
    }

    document.getElementById('user-input').addEventListener("keypress", (e) => { if(e.key === "Enter") sendMessage(); });
    window.onload = () => addMsg("SYSTÈME NDX.A INITIALISÉ...<br>LOYAUTÉ ENVERS **NDIAYE ADAMA** : 100%<br>Veuillez entrer une requête.", 'ai-msg');
</script>
</body>
</html>
